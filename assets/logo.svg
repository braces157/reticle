<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171719"/>
      <stop offset="100%" stop-color="#09090A"/>
    </linearGradient>
    <linearGradient id="rim" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="256" cy="256" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3AA9FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3AA9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Obsidian squircle body -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" stroke="url(#rim)" stroke-width="3"/>

  <!-- Subtle optical calibration ticks -->
  <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="92" x2="256" y2="112"/>
    <line x1="256" y1="400" x2="256" y2="420"/>
    <line x1="92" y1="256" x2="112" y2="256"/>
    <line x1="400" y1="256" x2="420" y2="256"/>
  </g>

  <!-- Subtle inner focal glass plane -->
  <rect x="176" y="176" width="160" height="160" rx="22" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2.5"/>

  <!-- Precision white viewfinder corner brackets -->
  <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 192 V146 C128 136 136 128 146 128 H192"/>
    <path d="M320 128 H366 C376 128 384 136 384 146 V192"/>
    <path d="M128 320 V366 C128 376 136 384 146 384 H192"/>
    <path d="M320 384 H366 C376 384 384 376 384 366 V320"/>
  </g>

  <!-- Optical pick focal point -->
  <circle cx="256" cy="256" r="56" fill="url(#dotGlow)"/>
  <circle cx="256" cy="256" r="22" fill="#3AA9FF"/>
  <circle cx="256" cy="256" r="22" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5"/>
</svg>
