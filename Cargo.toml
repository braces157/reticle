[package]
name = "reticle"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/braces157/reticle"
description = "Native Rust snipping, pin, annotation, offline OCR, and BYOK AI translate utility for Windows"

[dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
base64 = "0.22"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.37"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
global-hotkey = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tray-icon = { version = "0.26", default-features = false }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
